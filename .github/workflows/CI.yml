name: CI
on: [ push, pull_request ]
jobs:
  build_browsers:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        browser: [ Firefox, ChromeHeadless ]

    runs-on: ${{ matrix.os }}

    # A nivel de job para que el `if` del paso de coverage pueda leerlo: las
    # variables declaradas en un paso no estan disponibles en su propia
    # condicion.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Setup project
      uses: bpmn-io/actions/setup@latest
    - name: Build (with coverage)
      if: matrix.browser == 'ChromeHeadless'
      env:
        COVERAGE: 1
        TEST_BROWSERS: ${{ matrix.browser }}
      run: npm run all
    - name: Build
      if: matrix.browser == 'Firefox'
      env:
        TEST_BROWSERS: ${{ matrix.browser }}
      run: xvfb-run npm run all
    # Este fork no tiene configurado CODECOV_TOKEN. Sin el secreto la subida
    # falla («not valid tokenless upload») y tumbaba el job entero, asi que solo
    # se ejecuta cuando el token existe.
    - name: Upload coverage
      if: matrix.browser == 'ChromeHeadless' && env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true

  build_os:

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
        browser: [ ChromeHeadless ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Setup project
      uses: bpmn-io/actions/setup@latest
    - name: Build
      env:
        TEST_BROWSERS: ${{ matrix.browser }}
      run: npm run all
